[package]
name = "bev"
version = "1.57.2"
description = "BEV — futuristic AI voice assistant for Windows 11 and Linux"
authors = ["cbevss"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "bev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.0.2"
tauri-plugin-http = "2.0.4"
trash = "5"
arboard = { version = "3", default-features = false, features = ["image-data"] }
pdf-extract = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset"] }
tauri-plugin-store = "2.1.0"
tauri-plugin-notification = "2.0.1"
tauri-plugin-global-shortcut = "2.0.0"
tauri-plugin-autostart = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
sysinfo = "0.32"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3.2", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
log = "0.4"
xcap = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
tauri-plugin-log = "2.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Shutdown",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_UI_Accessibility",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Security_Cryptography",
  "Storage_Streams",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
