name: Build BEV

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: sidecar/wa/go.sum

      # BEV's WhatsApp linked-device helper, bundled as a resource.
      - name: Build WhatsApp helper
        working-directory: sidecar/wa
        shell: bash
        run: |
          go mod tidy
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui" -o ../../src-tauri/binaries/bev-wa.exe .

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build installer (NSIS)
        run: npm run tauri:build
        env:
          # Required because the bundle emits signed updater artifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # Tauri names the file BEV_<version>_x64-setup.exe; publish it as BEV-Setup.exe.
      - name: Rename installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $exe) { throw "installer not found" }
          Copy-Item $exe.FullName BEV-Setup.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BEV-Setup
          path: BEV-Setup.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev libdbus-1-dev libxdo-dev rpm patchelf
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: sidecar/wa/go.sum
      - name: Build WhatsApp helper
        working-directory: sidecar/wa
        run: |
          go mod tidy
          CGO_ENABLED=0 go build -trimpath -o ../../src-tauri/binaries/bev-wa .
      - run: npm ci
        env:
          # onnxruntime-node (via kokoro-js) otherwise fetches a CUDA build on Linux.
          npm_config_onnxruntime_node_install_cuda: skip
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib
      - name: Build RPM + AppImage
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: BEV-Linux
          path: |
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Every change to main has to ship: the version must be higher than every release so far, or the tag
  # already exists (nothing is released) or apps on a newer number never update to it. Checked on PRs
  # too, so a forgotten or reused version number fails before merging.
  version-is-new:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          v=$(node -p "require('./package.json').version")
          latest=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "This version: $v, newest release: ${latest:-none}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "v$v" = "v$latest" ] \
             && [ "$(git ls-remote --tags origin "refs/tags/v$v^{}" "refs/tags/v$v" | head -1 | cut -f1)" = "$(git rev-parse HEAD)" ]; then
            exit 0          # re-run of the commit that made this release
          fi
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$v" | sort -V | tail -1)" != "$v" -o "$v" = "$latest" ]; then
            echo "::error::Version $v isn't higher than the newest release ($latest). Bump package.json, tauri.conf.json and Cargo.toml so this ships as an update."
            exit 1
          fi

  # Decides whether this run publishes a release, and which version.
  # - Push to main: release if the version in the code (package.json) has no
  #   v<version> tag yet. Bumping the version in a PR and merging it is all it
  #   takes; the tag is created on that exact merge commit.
  # - Tag push (manual): only if the tag matches the version in the code, so a
  #   tag can't publish old code under a new number.
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          v=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "$v" != "$conf" ] || [ "$v" != "$cargo" ]; then
            echo "::error::Versions disagree: package.json $v, tauri.conf.json $conf, Cargo.toml $cargo"
            exit 1
          fi
          tag="v$v"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "$tag" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} doesn't match the version in the code ($v). Bump the version and merge instead; main releases automatically."
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already released; nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $v on main: releasing $tag."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # Build, sign, and publish the release with the installer plus the updater's
  # latest.json + .sig, so running apps auto-update to it.
  release:
    needs: [build, build-linux, version, version-is-new]
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev libdbus-1-dev libxdo-dev rpm patchelf
      - run: npm ci
        env:
          # onnxruntime-node (via kokoro-js) otherwise fetches a CUDA build on Linux.
          npm_config_onnxruntime_node_install_cuda: skip
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add this repo secret from src-tauri/bev-update.key (see docs/RELEASING.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ needs.version.outputs.tag }}
          # Tag the commit that was built (creates the tag if it doesn't exist).
          releaseCommitish: ${{ github.sha }}
          releaseName: "BEV ${{ needs.version.outputs.tag }}"
          releaseDraft: false
          prerelease: false
