name: BEV Accounts

# Tests the accounts service on every change; deploys it to Cloudflare from
# main once the secrets in docs/ACCOUNTS.md are set. Without them the deploy
# is skipped, and the app keeps accounts switched off.
on:
  push:
    branches: [main]
    paths: ["accounts/**", ".github/workflows/accounts.yml"]
  pull_request:
    paths: ["accounts/**", ".github/workflows/accounts.yml"]
  workflow_dispatch:

concurrency:
  group: bev-accounts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: accounts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: accounts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: accounts
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$DISCORD_CLIENT_ID" ] || [ -z "$DISCORD_CLIENT_SECRET" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::BEV Accounts isn't set up yet (needs the Cloudflare and Discord secrets), so nothing was deployed. See docs/ACCOUNTS.md."
          fi

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: accounts/package-lock.json
      - if: steps.cfg.outputs.skip != 'true'
        run: npm ci

      - name: Database
        if: steps.cfg.outputs.skip != 'true'
        run: |
          set -euo pipefail
          find_db() {
            npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="bev-accounts");if(d)console.log(d.uuid)'
          }
          id=$(find_db)
          if [ -z "$id" ]; then
            npx wrangler d1 create bev-accounts > /dev/null
            id=$(find_db)
          fi
          [ -n "$id" ] || { echo "::error::Couldn't find or create the bev-accounts D1 database."; exit 1; }
          sed -i "s/__D1_DATABASE_ID__/$id/" wrangler.toml
          npx wrangler d1 execute bev-accounts --remote --file schema.sql --yes

      - name: Deploy
        id: deploy
        if: steps.cfg.outputs.skip != 'true'
        run: |
          set -euo pipefail
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::Deployed, but no workers.dev address was printed. Claim a workers.dev subdomain in the Cloudflare dashboard (Workers & Pages), then re-run."; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Secrets
        if: steps.cfg.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Piped straight in: secrets never touch disk or the log.
          node -e 'process.stdout.write(JSON.stringify({ DISCORD_CLIENT_ID: process.env.DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET: process.env.DISCORD_CLIENT_SECRET }))' | npx wrangler secret bulk

      - name: Summary
        if: steps.cfg.outputs.skip != 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### BEV Accounts is live"
            echo ""
            echo "Address: $URL"
            echo ""
            echo "1. In the Discord Developer Portal → your app → OAuth2 → Redirects, add: \`$URL/auth/discord/callback\`"
            echo "2. Put the address in \`src/account/config.ts\` (ACCOUNTS_URL) and release: the app will then ask everyone to sign in."
          } >> "$GITHUB_STEP_SUMMARY"
